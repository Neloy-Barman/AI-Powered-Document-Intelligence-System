# Docker Compose for AI-Powered Document Intelligence System
#
# Start services:
#   docker compose up -d
#
# Check status:
#   docker compose ps
#
# Stop services:
#   docker compose down
#
# Stop and remove volumes:
#   docker compose down -v
#
# View logs:
#   docker compose logs -f

services:
  postgres:
    image: postgres:16
    container_name: ai_powered_document_intelligence_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_powered_document_intelligence_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_powered_document_intelligence_system_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
