# Docker Compose for AI-Powered Document Intelligence System
#
# Services:
# - postgres: PostgreSQL database for document metadata and processing history
# - redis: Redis queue for RQ background jobs
# - qdrant: Qdrant vector database for semantic search
# - adminer: Web UI for PostgreSQL
#
# Start all services:
#   docker compose up -d
#
# Check status:
#   docker compose ps
#
# Stop services:
#   docker compose down
#
# Stop and remove volumes:
#   docker compose down -v
#
# View logs:
#   docker compose logs -f
#
# UI URLs:
# - PostgreSQL Adminer: http://localhost:8080
#   System: PostgreSQL
#   Server: ai_powered_document_intelligence_system_postgres
#   Username: postgres
#   Password: postgres
#   Database: ai_powered_document_intelligence_system
#
# - Qdrant Dashboard: http://localhost:6333/dashboard
#
# - Redis: localhost:6379
# - PostgreSQL: localhost:5433
# - Qdrant REST API: http://localhost:6333
# - Qdrant gRPC: localhost:6334

services:
  postgres:
    image: postgres:16
    container_name: ai_powered_document_intelligence_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_powered_document_intelligence_system
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_powered_document_intelligence_system_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: ai_powered_document_intelligence_system_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  adminer:
    image: adminer
    container_name: ai_powered_document_intelligence_system_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  qdrant_data:
